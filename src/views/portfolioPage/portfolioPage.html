<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Details</title>
    <!-- Chart.js Local Files -->
    <script src="./libs/chart.umd.js"></script>
    <style>
        /* VS Code theme detection classes */
        .vscode-light {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f3f3;
            --bg-tertiary: #e8e8e8;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-accent: #0078d4;
            --border-primary: #d1d1d1;
            --border-secondary: #e5e5e5;
            --shadow-primary: rgba(0, 0, 0, 0.1);
            --button-bg: #0078d4;
            --button-text: #ffffff;
            --button-hover-bg: #106ebe;
            --success-color: #388e3c;
            --error-color: #d32f2f;
            --error-bg: rgba(211, 47, 47, 0.1);
            --error-border: #d32f2f;
            --badge-simple-bg: #e6f2ff;
            --badge-simple-text: #1e40af;
            --badge-investment-bg: #fff8e1;
            --badge-investment-text: #f57c00;
            --badge-composite-bg: #f3e8ff;
            --badge-composite-text: #7c3aed;
            --badge-stock-bg: #e0f8f8;
            --badge-stock-text: #0891b2;
        }

        .vscode-dark {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d30;
            --text-primary: #cccccc;
            --text-secondary: #969696;
            --text-accent: #4fc3f7;
            --border-primary: #3c3c3c;
            --border-secondary: #404040;
            --shadow-primary: rgba(0, 0, 0, 0.4);
            --button-bg: #0e639c;
            --button-text: #ffffff;
            --button-hover-bg: #1177bb;
            --success-color: #4caf50;
            --error-color: #f44336;
            --error-bg: rgba(244, 67, 54, 0.1);
            --error-border: #f44336;
            --badge-simple-bg: rgba(30, 64, 175, 0.2);
            --badge-simple-text: #60a5fa;
            --badge-investment-bg: rgba(255, 152, 0, 0.2);
            --badge-investment-text: #ff9800;
            --badge-composite-bg: rgba(124, 58, 237, 0.2);
            --badge-composite-text: #a78bfa;
            --badge-stock-bg: rgba(8, 145, 178, 0.2);
            --badge-stock-text: #22d3ee;
        }

        .vscode-high-contrast {
            --bg-primary: #000000;
            --bg-secondary: #000000;
            --bg-tertiary: #000000;
            --text-primary: #ffffff;
            --text-secondary: #ffffff;
            --text-accent: #ffffff;
            --border-primary: #ffffff;
            --border-secondary: #ffffff;
            --shadow-primary: rgba(255, 255, 255, 0.1);
            --button-bg: #ffffff;
            --button-text: #000000;
            --button-hover-bg: #ffffff;
            --success-color: #00ff00;
            --error-color: #ff0000;
            --error-bg: #000000;
            --error-border: #ff0000;
            --badge-simple-bg: #000000;
            --badge-simple-text: #ffffff;
            --badge-investment-bg: #000000;
            --badge-investment-text: #ffffff;
            --badge-composite-bg: #000000;
            --badge-composite-text: #ffffff;
            --badge-stock-bg: #000000;
            --badge-stock-text: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .portfolio-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-primary);
        }

        .portfolio-name {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
            color: var(--text-primary);
        }

        .portfolio-key-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .data-item {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-primary);
            transition: box-shadow 0.2s ease;
        }

        .data-item:hover {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .data-item label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-item .value {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--text-primary);
        }

        .data-item .sub-value {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Chart Styles */
        .chart-container {
            margin: 30px 0 40px 0;
            padding: 25px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-primary);
            transition: box-shadow 0.2s ease;
        }

        .chart-container:hover {
            box-shadow: 0 4px 8px var(--shadow-primary);
        }

        .chart-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
            width: 100%;
            margin-top: 15px;
        }

        .chart-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .chart-period-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-primary);
            background: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-period-btn.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        .chart-period-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-accent);
        }

        .chart-period-btn.active:hover {
            background: var(--button-hover-bg);
            border-color: var(--button-hover-bg);
        }

        /* Holdings list */
        .portfolio-holdings {
            margin-top: 40px;
        }

        .holdings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .holdings-header h2 {
            margin: 0;
            font-size: 1.5em;
            color: var(--text-primary);
        }

        .holdings-list {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            max-height: 600px;
            overflow-y: auto;
        }

        .holdings-table-header {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.8em;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .holdings-table-header .header-name {
            flex: 1;
            padding: 4px 8px;
        }

        .holdings-table-header .header-type {
            flex: 0 0 110px;
            text-align: center;
            padding: 4px 8px;
        }

        .holdings-table-header .header-value {
            flex: 0 0 160px;
            text-align: right;
            padding: 4px 8px;
        }

        .holdings-table-header .header-share {
            flex: 0 0 80px;
            text-align: right;
            padding: 4px 8px;
        }

        .holding-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .holding-item:hover {
            background-color: var(--bg-secondary);
            border-color: var(--text-accent);
        }

        .holding-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .holding-name-display {
            flex: 1;
            font-size: 0.95em;
            font-weight: 600;
            color: var(--text-primary);
            padding: 4px 8px;
        }

        .holding-account-display {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .holding-type-badge {
            flex: 0 0 110px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .holding-type-badge.simple {
            background: var(--badge-simple-bg);
            color: var(--badge-simple-text);
            border: 1px solid var(--badge-simple-text);
        }

        .holding-type-badge.investment {
            background: var(--badge-investment-bg);
            color: var(--badge-investment-text);
            border: 1px solid var(--badge-investment-text);
        }

        .holding-type-badge.composite {
            background: var(--badge-composite-bg);
            color: var(--badge-composite-text);
            border: 1px solid var(--badge-composite-text);
        }

        .holding-type-badge.stock {
            background: var(--badge-stock-bg);
            color: var(--badge-stock-text);
            border: 1px solid var(--badge-stock-text);
        }

        .holding-value-display {
            flex: 0 0 160px;
            font-size: 1em;
            font-weight: 600;
            text-align: right;
            padding: 4px 8px;
            color: var(--text-primary);
        }

        .holding-value-original {
            display: block;
            font-size: 0.8em;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .holding-share-display {
            flex: 0 0 80px;
            font-size: 0.85em;
            text-align: right;
            padding: 4px 8px;
            color: var(--text-secondary);
        }

        .btn {
            background: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: var(--button-hover-bg);
            transform: translateY(-1px);
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            padding: 40px;
        }

        .error {
            color: var(--error-color);
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .portfolio-name {
                font-size: 1.5em;
            }

            .portfolio-key-data {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .holdings-table-header {
                display: none;
            }

            .holding-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .holding-name-display,
            .holding-type-badge,
            .holding-value-display,
            .holding-share-display {
                flex: none;
                width: 100%;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="portfolio-header">
        <h1 class="portfolio-name" id="portfolioName">Portfolio</h1>
    </div>

    <div class="portfolio-key-data" id="portfolioKeyData">
        <div class="data-item">
            <label>Current Value</label>
            <div class="value" id="currentValue">Loading...</div>
            <div class="sub-value" id="lastUpdateDate"></div>
        </div>
        <div class="data-item">
            <label>Holdings</label>
            <div class="value" id="holdingsCount">-</div>
            <div class="sub-value">Total assets in portfolio</div>
        </div>
    </div>

    <!-- Chart Section -->
    <div class="chart-container">
        <div class="chart-title">Value Over Time</div>
        <div class="chart-controls">
            <button class="chart-period-btn active" data-period="all">All Time</button>
            <button class="chart-period-btn" data-period="1y">1 Year</button>
            <button class="chart-period-btn" data-period="6m">6 Months</button>
            <button class="chart-period-btn" data-period="3m">3 Months</button>
            <button class="chart-period-btn" data-period="1m">1 Month</button>
        </div>
        <div class="chart-wrapper">
            <canvas id="valueChart"></canvas>
        </div>
    </div>

    <div class="portfolio-holdings">
        <div class="holdings-header">
            <h2>Holdings</h2>
            <button class="btn" onclick="refreshPortfolio()">↻ Refresh</button>
        </div>
        <div class="holdings-list" id="holdingsList">
            <div class="loading">Loading holdings...</div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        // Chart variables
        let valueChart = null;
        let chartData = [];
        let currentPeriod = 'all';
        const PORTFOLIO_CURRENCY = 'CNY';

        // Function to manually set theme (used by host.html if embedded)
        function setTheme(themeClass) {
            document.body.className = themeClass;
        }

        // Listen for messages from the extension
        window.addEventListener('message', event => {
            const message = event.data;
            console.log('Received message:', message);

            switch (message.type) {
                case 'PORTFOLIO_DATA':
                    chartData = message.data.valueHistory || [];
                    updatePortfolioDisplay(message.data);
                    updateChart(chartData);
                    break;
                case 'ERROR':
                    showError(message.data);
                    break;
            }
        });

        function refreshPortfolio() {
            vscode.postMessage({ type: 'REFRESH_DATA' });
        }

        function updatePortfolioDisplay(summary) {
            console.log('Updating portfolio display with:', summary);

            // Update current value (always CNY)
            const valueInCNY = summary.currentValue.valueInCNY;
            document.getElementById('currentValue').innerHTML = '¥' + valueInCNY.toLocaleString('zh-CN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            // Update last update date
            if (summary.currentValue.lastUpdateDate) {
                document.getElementById('lastUpdateDate').textContent =
                    `Last updated: ${new Date(summary.currentValue.lastUpdateDate).toLocaleDateString()}`;
            } else {
                document.getElementById('lastUpdateDate').textContent = '';
            }

            // Update holdings count
            const holdings = summary.holdings || [];
            document.getElementById('holdingsCount').textContent = holdings.length.toString();

            // Update holdings list
            updateHoldingsList(holdings, valueInCNY);
        }

        function updateHoldingsList(holdings, totalValueInCNY) {
            const holdingsList = document.getElementById('holdingsList');

            if (!holdings || holdings.length === 0) {
                holdingsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div>No assets found in the portfolio.</div>
                    </div>
                `;
                return;
            }

            const tableHeader = `
                <div class="holdings-table-header">
                    <div class="header-name">Asset</div>
                    <div class="header-type">Type</div>
                    <div class="header-value">Value</div>
                    <div class="header-share">Share</div>
                </div>
            `;

            const holdingsHtml = holdings.map(holding => {
                const currency = holding.currentValue.currency || 'CNY';
                const valueInCNY = holding.currentValue.valueInCNY;
                const originalValue = holding.currentValue.currentValue;

                // Primary value shown in CNY for easy comparison across the portfolio
                let valueDisplay = '¥' + valueInCNY.toLocaleString('zh-CN', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                // For non-CNY assets, also show the original currency amount
                let originalDisplay = '';
                if (currency !== 'CNY') {
                    originalDisplay = `<span class="holding-value-original">${currency} ${originalValue.toLocaleString('en-US', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    })}</span>`;
                }

                // Percentage share of the total portfolio value
                let sharePercent = '-';
                if (totalValueInCNY && totalValueInCNY !== 0) {
                    sharePercent = ((valueInCNY / totalValueInCNY) * 100).toFixed(1) + '%';
                }

                // Show account context when present
                let accountDisplay = '';
                if (holding.account) {
                    accountDisplay = `<span class="holding-account-display"> · ${holding.account}</span>`;
                }

                return `
                    <div class="holding-item fade-in">
                        <div class="holding-row">
                            <div class="holding-name-display">${holding.name}${accountDisplay}</div>
                            <div class="holding-type-badge ${holding.type}">${holding.type}</div>
                            <div class="holding-value-display">${valueDisplay}${originalDisplay}</div>
                            <div class="holding-share-display">${sharePercent}</div>
                        </div>
                    </div>
                `;
            }).join('');

            holdingsList.innerHTML = tableHeader + holdingsHtml;
        }

        function showError(errorData) {
            document.getElementById('currentValue').textContent = 'Error loading';

            const holdingsList = document.getElementById('holdingsList');
            holdingsList.innerHTML = `
                <div class="error">
                    <strong>Error Loading Portfolio Data</strong><br>
                    ${errorData.message}
                </div>
            `;
        }

        // Chart functionality
        const chartConfig = {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Portfolio Value',
                    data: [],
                    borderColor: getComputedStyle(document.documentElement).getPropertyValue('--text-accent') || '#0078d4',
                    backgroundColor: 'rgba(0, 120, 212, 0.1)',
                    borderWidth: 2,
                    tension: 0.2,
                    fill: false,
                    pointBackgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--text-accent') || '#0078d4',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 1,
                    pointRadius: 2,
                    pointHoverRadius: 4,
                    pointHoverBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    intersect: false,
                    mode: 'nearest',
                    axis: 'x'
                },
                animation: {
                    duration: 750,
                    easing: 'easeInOutQuart'
                },
                plugins: {
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.9)',
                        titleColor: '#ffffff',
                        bodyColor: '#ffffff',
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--text-accent') || '#0078d4',
                        borderWidth: 1,
                        cornerRadius: 8,
                        displayColors: false,
                        padding: 16,
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 12 },
                        callbacks: {
                            label: function(context) {
                                const value = context.parsed.y;
                                return 'Value: ' + formatCurrency(value, PORTFOLIO_CURRENCY);
                            },
                            afterLabel: function(context) {
                                const point = context.raw;
                                const entry = point.entry;

                                if (!entry || !entry.activities || entry.activities.length === 0) {
                                    return [];
                                }

                                const afterLabels = [];
                                afterLabels.push('');
                                afterLabels.push(`Activities on this date: ${entry.activities.length}`);
                                return afterLabels;
                            },
                            title: function(context) {
                                const date = new Date(context[0].parsed.x);
                                return date.toLocaleDateString('en-US', {
                                    weekday: 'short',
                                    year: 'numeric',
                                    month: 'short',
                                    day: 'numeric'
                                });
                            }
                        }
                    },
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        min: undefined,
                        max: undefined,
                        grace: 0,
                        offset: false,
                        grid: {
                            display: true,
                            color: function(context) {
                                const baseColor = getComputedStyle(document.documentElement).getPropertyValue('--border-secondary') || '#e5e5e5';
                                return context.tick.major ? baseColor : 'rgba(229, 229, 229, 0.3)';
                            },
                            lineWidth: function(context) {
                                return context.tick.major ? 1 : 0.5;
                            }
                        },
                        border: {
                            display: true,
                            color: getComputedStyle(document.documentElement).getPropertyValue('--border-primary') || '#d1d1d1',
                            width: 1
                        },
                        ticks: {
                            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary') || '#666666',
                            maxTicksLimit: 6,
                            padding: 8,
                            font: { size: 11 },
                            callback: function(value) {
                                const date = new Date(value);
                                const now = new Date();
                                const diffDays = (now - date) / (1000 * 60 * 60 * 24);

                                if (diffDays < 30) {
                                    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                                } else if (diffDays < 365) {
                                    return date.toLocaleDateString(undefined, { month: 'short' });
                                } else {
                                    return date.toLocaleDateString(undefined, { year: 'numeric', month: 'short' });
                                }
                            }
                        }
                    },
                    y: {
                        beginAtZero: false,
                        grid: {
                            display: true,
                            color: function(context) {
                                const baseColor = getComputedStyle(document.documentElement).getPropertyValue('--border-secondary') || '#e5e5e5';
                                return context.tick.major ? baseColor : 'rgba(229, 229, 229, 0.2)';
                            },
                            lineWidth: function(context) {
                                return context.tick.major ? 1 : 0.5;
                            }
                        },
                        border: {
                            display: true,
                            color: getComputedStyle(document.documentElement).getPropertyValue('--border-primary') || '#d1d1d1',
                            width: 1
                        },
                        ticks: {
                            color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary') || '#666666',
                            maxTicksLimit: 6,
                            padding: 8,
                            font: { size: 11 },
                            callback: function(value) {
                                return formatCurrency(value, PORTFOLIO_CURRENCY);
                            }
                        }
                    }
                }
            }
        };

        // Initialize chart
        function initChart() {
            try {
                if (typeof Chart === 'undefined') {
                    console.error('Chart.js is not loaded');
                    showChartError('Chart.js library failed to load');
                    return;
                }

                const canvas = document.getElementById('valueChart');
                if (!canvas) {
                    console.error('Chart canvas not found');
                    showChartError('Chart canvas element not found');
                    return;
                }

                const ctx = canvas.getContext('2d');
                if (!ctx) {
                    console.error('Could not get 2D context');
                    showChartError('Could not get canvas 2D context');
                    return;
                }

                console.log('Initializing portfolio chart...');
                valueChart = new Chart(ctx, chartConfig);
                console.log('Chart initialized successfully');
            } catch (error) {
                console.error('Error initializing chart:', error);
                showChartError('Failed to initialize chart: ' + error.message);
            }
        }

        function showChartError(message) {
            const chartWrapper = document.querySelector('.chart-wrapper');
            if (chartWrapper) {
                chartWrapper.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; height: 300px; background: var(--bg-tertiary); border-radius: 8px; border: 2px dashed var(--border-primary);">
                        <div style="text-align: center; color: var(--text-secondary);">
                            <div style="font-size: 2em; margin-bottom: 10px;">📊</div>
                            <div>Chart not available</div>
                            <div style="font-size: 0.8em; margin-top: 5px;">${message}</div>
                        </div>
                    </div>
                `;
            }
        }

        // Update chart with new data
        function updateChart(valueHistory) {
            if (!valueChart) {
                console.log('Chart not initialized yet');
                return;
            }

            const dataPoints = processValueHistoryForChart(valueHistory);
            const filteredData = filterDataByPeriod(dataPoints, currentPeriod);

            valueChart.data.datasets[0].data = filteredData;

            const now = new Date();
            let xAxisMin, xAxisMax;

            if (currentPeriod === 'all') {
                if (filteredData.length > 0) {
                    const xValues = filteredData.map(point => point.x);
                    xAxisMin = Math.min(...xValues);
                    xAxisMax = Math.max(...xValues);
                } else {
                    xAxisMin = undefined;
                    xAxisMax = undefined;
                }
            } else {
                let cutoffDate;
                switch (currentPeriod) {
                    case '1m':
                        cutoffDate = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
                        break;
                    case '3m':
                        cutoffDate = new Date(now.getTime() - (90 * 24 * 60 * 60 * 1000));
                        break;
                    case '6m':
                        cutoffDate = new Date(now.getTime() - (180 * 24 * 60 * 60 * 1000));
                        break;
                    case '1y':
                        cutoffDate = new Date(now.getTime() - (365 * 24 * 60 * 60 * 1000));
                        break;
                    default:
                        cutoffDate = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
                }

                xAxisMin = cutoffDate.getTime();
                xAxisMax = now.getTime();
            }

            valueChart.options.scales.x.min = xAxisMin;
            valueChart.options.scales.x.max = xAxisMax;
            valueChart.options.scales.y.min = undefined;
            valueChart.options.scales.y.max = undefined;

            valueChart.update('active');
            console.log('Chart updated with', filteredData.length, 'data points');
        }

        // Process value history into chart data points
        function processValueHistoryForChart(valueHistory) {
            if (!valueHistory || valueHistory.length === 0) return [];

            const dataPoints = [];
            valueHistory.forEach(entry => {
                const entryDate = new Date(entry.date);
                const value = entry.currentValue.valueInCNY;

                dataPoints.push({
                    x: entryDate.getTime(),
                    y: value,
                    isValueHistory: true,
                    entry: entry
                });
            });

            return dataPoints;
        }

        // Filter data by time period
        function filterDataByPeriod(dataPoints, period) {
            if (period === 'all' || dataPoints.length === 0) {
                return dataPoints;
            }

            const now = new Date();
            let cutoffDate;

            switch (period) {
                case '1m':
                    cutoffDate = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
                    break;
                case '3m':
                    cutoffDate = new Date(now.getTime() - (90 * 24 * 60 * 60 * 1000));
                    break;
                case '6m':
                    cutoffDate = new Date(now.getTime() - (180 * 24 * 60 * 60 * 1000));
                    break;
                case '1y':
                    cutoffDate = new Date(now.getTime() - (365 * 24 * 60 * 60 * 1000));
                    break;
                default:
                    return dataPoints;
            }

            const cutoffTimestamp = cutoffDate.getTime();
            const filteredPoints = dataPoints.filter(point => point.x >= cutoffTimestamp);

            // If filtering removes all points, include a synthetic point at the cutoff
            // using the most recent value from before the cutoff for context
            if (filteredPoints.length === 0 && dataPoints.length > 0) {
                const pointsBeforeCutoff = dataPoints.filter(point => point.x < cutoffTimestamp);
                if (pointsBeforeCutoff.length > 0) {
                    const mostRecentBeforeCutoff = pointsBeforeCutoff[pointsBeforeCutoff.length - 1];
                    return [{
                        x: cutoffTimestamp,
                        y: mostRecentBeforeCutoff.y,
                        synthetic: true
                    }];
                } else {
                    return [];
                }
            }

            // Add a connecting point at the cutoff for better visualization
            if (filteredPoints.length > 0 && dataPoints.length > filteredPoints.length) {
                const firstFilteredPoint = filteredPoints[0];
                if (firstFilteredPoint.x > cutoffTimestamp) {
                    const pointsBeforeCutoff = dataPoints.filter(point => point.x < cutoffTimestamp);
                    if (pointsBeforeCutoff.length > 0) {
                        const lastBeforeCutoff = pointsBeforeCutoff[pointsBeforeCutoff.length - 1];
                        filteredPoints.unshift({
                            x: cutoffTimestamp,
                            y: lastBeforeCutoff.y,
                            synthetic: true
                        });
                    }
                }
            }

            return filteredPoints;
        }

        // Format currency for display
        function formatCurrency(value, currency) {
            try {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: currency,
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(value);
            } catch (e) {
                return `${currency} ${value.toLocaleString()}`;
            }
        }

        // Period selection handlers
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('chart-period-btn')) {
                document.querySelectorAll('.chart-period-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                e.target.classList.add('active');

                currentPeriod = e.target.dataset.period;

                if (chartData.length > 0) {
                    updateChart(chartData);
                }
            }
        });

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Portfolio page loaded');
            initChart();
        });
    </script>
</body>
</html>
